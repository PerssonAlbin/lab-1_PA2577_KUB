worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        # Serve the main application
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Serve Nuxt static assets with correct MIME types
        location /_nuxt/ {
            root /usr/share/nginx/html;
            gzip_static on;
            add_header Content-Type application/javascript;
        }

        # Proxy API requests to the backend service
        location /api/ {
            proxy_pass http://backend-service:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            error_page 502 503 504 =200 /api-fallback;
        }

        location = /api-fallback {
            default_type application/json;
            return 200 '{"message": "Backend is not available yet. Please try again later."}';
        }

        # Enable gzip compression for performance
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
        gzip_proxied any;
        gzip_comp_level 6;

        # Handle 404 fallback for SPA
        error_page 404 /index.html;
    }
}

